<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Icon generator</title>
<style>
body{font:16px/1.5 system-ui,sans-serif;max-width:420px;margin:0 auto;padding:16px;background:#faf9f5;color:#1f1e1d}
img{width:160px;height:160px;border-radius:24px;display:block;margin:12px 0}
button{font:inherit;display:block;width:100%;padding:10px;margin-bottom:8px;border:0.5px solid #d9d7cf;border-radius:8px;background:#fff;color:#1f1e1d}
p{font-size:14px;color:#6b6a66}
</style>
</head>
<body>
<h1 style="font-size:20px;font-weight:500">Icons for Day Layers</h1>
<img id="pv" alt="Icon preview">
<button data-s="192" data-n="icon-192.png">Download icon-192.png</button>
<button data-s="512" data-n="icon-512.png">Download icon-512.png</button>
<button data-s="180" data-n="icon-180.png">Download icon-180.png (iPhone)</button>
<p id="msg">Download all three files and upload them to the repository root next to index.html.</p>
<script>
var svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" fill="#fbeedd"/><g transform="translate(256 256) scale(0.88) translate(-256 -256) translate(0 -22)"><rect x="84" y="400" width="344" height="14" rx="7" fill="#cfc9bb"/><rect x="116" y="344" width="280" height="56" rx="8" fill="#8a5a3b"/><rect x="116" y="326" width="280" height="18" fill="#fff3e0"/><rect x="116" y="270" width="280" height="56" fill="#a06b45"/><rect x="116" y="252" width="280" height="18" fill="#fff3e0"/><rect x="116" y="196" width="280" height="56" fill="#8a5a3b"/><path d="M108 200 Q108 178 130 178 H382 Q404 178 404 200 V214 Q404 226 392 226 Q380 226 380 214 Q380 206 370 206 Q360 206 360 218 Q360 238 346 238 Q332 238 332 218 Q332 208 322 208 H190 Q180 208 180 218 Q180 232 168 232 Q156 232 156 218 Q156 206 146 206 Q136 206 136 214 Q136 226 122 226 Q108 226 108 214 Z" fill="#f4a9b8"/><circle cx="256" cy="156" r="20" fill="#d9434e"/><circle cx="249" cy="149" r="5" fill="#f08a90"/><path d="M256 136 Q262 118 280 112" fill="none" stroke="#5a7a2e" stroke-width="6" stroke-linecap="round"/></g></svg>`;
var src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
document.getElementById('pv').src=src;
var img=new Image();
var ready=false;
img.onload=function(){ready=true};
img.src=src;
function make(size,name){
if(!ready){document.getElementById('msg').textContent='Image is still loading, tap again.';return}
var c=document.createElement('canvas');
c.width=size;c.height=size;
c.getContext('2d').drawImage(img,0,0,size,size);
c.toBlob(function(b){
var a=document.createElement('a');
a.href=URL.createObjectURL(b);
a.download=name;
document.body.appendChild(a);a.click();document.body.removeChild(a);
document.getElementById('msg').textContent='Downloaded: '+name;
},'image/png');
}
Array.prototype.forEach.call(document.querySelectorAll('button'),function(b){
b.addEventListener('click',function(){make(+b.getAttribute('data-s'),b.getAttribute('data-n'))});
});
</script>
</body>
</html>

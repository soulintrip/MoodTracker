function mkIcon(s){
  const c=document.createElement('canvas');c.width=c.height=s;
  const x=c.getContext('2d');
  x.fillStyle='#2e7d32';x.fillRect(0,0,s,s);
  x.fillStyle='#fff';x.beginPath();x.arc(s/2,s/2,s*.27,0,7);x.fill();
  x.fillStyle='#2e7d32';x.beginPath();x.arc(s/2,s/2,s*.19,0,7);x.fill();
  x.fillStyle='#fff';
  x.fillRect(s*.19,s*.46,s*.04,s*.08);x.fillRect(s*.77,s*.46,s*.04,s*.08);
  return c.toDataURL('image/png');
}

};

// отмена применения при изменении меню
function touch(){
  if(S.applied&&S.backup){S.pantry=JSON.parse(S.backup)}

}

// ---------- расчёт ----------
const rnd=(a,u)=>{const st=u==='pcs'?.5:5;return Math.max(st,Math.round(a/st)*st)};
function portion(d,c){
  const m=ingMap();let base=0;
  for(const id in d.i)base+=d.i[id]*m[id].k;
  const s=base>0?Math.min(2.5,Math.max(.5,S.kcal*SHARE[c]/base)):1;
  const items={};let kc=0;
  for(const id in d.i){const a=rnd(d.i[id]*s,m[id].u);items[id]=a;kc+=a*m[id].k}
  return{items,kcal:Math.round(kc)};
}
function pick(c,used){
  const pool=DISH().filter(d=>d.c===c&&!S.off.includes(d.id));
  if(!pool.length)return null;
  let a=pool.filter(d=>!used.includes(d.id));if(!a.length)a=pool;
  return a[Math.floor(Math.random()*a.length)].id;
}
function gen(){
  touch();S.got={};const used={b:[],l:[],d:[]};
  S.menu=[0,1].map(()=>{const r={};for(const c of 'bld'){r[c]=pick(c,used[c]);used[c].push(r[c])}return r});
  save();render();
}
function rr(di,c){
  touch();S.menu[di][c]=pick(c,[S.menu[0][c],S.menu[1][c]]);save();render();
}
// заменить в меню блюда, которых больше нет или которые сменили приём пищи
function fixMenu(){
  const dm=Object.fromEntries(DISH().map(d=>[d.id,d]));
  S.menu.forEach(day=>{for(const c of 'bld'){
    const d=dm[day[c]];
    if(!d||d.c!==c)day[c]=pick(c,S.menu.map(x=>x[c]).filter(x=>dm[x]&&dm[x].c===c));
  }});
}
function totals(){
  const dm=Object.fromEntries(DISH().map(d=>[d.id,d])),need={};
  S.menu.forEach(day=>{for(const c of 'bld'){
    const d=dm[day[c]];if(!d)continue;
    const p=portion(d,c),n=c==='d'?2+(S.cont?1:0):2;
    for(const id in p.items)need[id]=(need[id]||0)+p.items[id]*n;
  }});
  return need;
}
function plan(){
  const need=totals(),m=ingMap();
  return Object.keys(need).map(id=>{
    const i=m[id],n=need[id],st=S.pantry[id]||0,buy=Math.max(0,n-st);
    const packs=Math.ceil(buy/i.p-1e-9);
    return{i,id,n,st,packs,left:st+packs*i.p-n};
  }).sort((a,b)=>a.i.n.localeCompare(b.i.n,'ru'));
}
// строки закупки (после «применить» берётся снимок)
function buyRows(){
  const m=ingMap();
  return(S.applied&&S.snap)?S.snap.filter(r=>m[r.id]).map(r=>({i:m[r.id],...r})):plan();
}
const buyCost=rows=>rows.reduce((a,r)=>a+r.packs*r.i.c,0);
function apply(){
  if(S.applied)return;
  const rows=plan();
  S.backup=JSON.stringify(S.pantry);
  S.snap=rows.map(r=>({id:r.id,n:r.n,st:r.st,packs:r.packs,left:r.left}));
  rows.forEach(r=>{const v=Math.round(r.left*100)/100;if(v>0.01)S.pantry[r.id]=v;else delete S.pantry[r.id]});
  S.applied=true;save();render();
}
function undo(){touch();save();render()}
// следующий цикл: остатки сохраняются, меню собирается заново
function nextCycle(){
  S.applied=false;S.backup=null;S.snap=null;
  gen();
}

// ---------- представления ----------
const TABS=[['menu','Меню'],['buy','Покупки'],['stock','Остатки'],['dishes','Блюда'],['ings','Продукты']];
function setTab(t){tab=t;editing=null;render()}

function vMenu(){
  const dm=Object.fromEntries(DISH().map(d=>[d.id,d])),m=ingMap();
  let h=`<div class="card">
  <label>Ккал на человека в день <input type="number" min="1000" max="4000" step="50" value="${S.kcal}" onchange="touch();S.kcal=Math.max(1000,Math.min(4000,+this.value||2000));save();render()"></label>
  <label class="ck"><input type="checkbox" ${S.cont?'checked':''} onchange="touch();S.cont=this.checked;save();render()"> Порция в контейнер на каждом ужине (+1 человек)</label>
  <button class="pri" onclick="gen()">Пересобрать всё меню</button>
  <div class="sm">Распределение: завтрак 30%, ланч 20%, ужин 50%. Контейнер не входит в норму. Вкладки переключаются свайпом.</div></div>`;
  S.menu.forEach((day,di)=>{
    let tot=0,cards='';
    for(const c of 'bld'){
      const d=dm[day[c]];
      if(!d){cards+=`<div class="meal"><b>${NAMES[c]}</b> — нет доступных блюд</div>`;continue}
      const p=portion(d,c);tot+=p.kcal;
      cards+=`<div class="meal"><div class="row"><b>${NAMES[c]}: ${esc(d.n)}</b><button onclick="rr(${di},'${c}')">↻</button></div>
      <div class="sm">${Object.entries(p.items).map(([id,a])=>`${esc(m[id].n)} ${f(a,m[id].u)}`).join(' · ')}</div>
      <div class="sm">${p.kcal} ккал/чел${c==='d'?` · готовить ${S.cont?3:2} порц.`:''}</div></div>`;
    }
    h+=`<div class="card"><h3>День ${di+1} — ${tot} ккал/чел</h3>${cards}</div>`;
  });
  return h;
}

function toggleGot(id,on){if(on)S.got[id]=1;else delete S.got[id];save();render()}
function vBuy(){
  const rows=buyRows();
  const need=rows.filter(r=>r.packs),inCart=need.filter(r=>S.got[r.id]).length;
  const packs=rows.reduce((a,r)=>a+r.packs,0),cost=buyCost(rows);
  let h=`<div class="card"><h3>Список покупок</h3>
  <div class="sm">Размеры упаковок и цены — ориентир Tesco, правятся во вкладке «Продукты». «Есть» берётся из остатков. Галочка — положил в корзину.</div>
  <table><tr><th></th><th>Продукт</th><th>Нужно</th><th>Есть</th><th>Купить</th><th>Останется</th></tr>
  ${rows.map(r=>`<tr class="${r.packs&&S.got[r.id]?'got':''}">
  <td>${r.packs?`<input type="checkbox" ${S.got[r.id]?'checked':''} onchange="toggleGot('${r.id}',this.checked)">`:''}</td>
  <td>${esc(r.i.n)}</td><td>${f(r.n,r.i.u)}</td><td>${r.st?f(r.st,r.i.u):'—'}</td>
  <td>${r.packs?`<b>${r.packs} × ${f(r.i.p,r.i.u)}</b><div class="sm">${gbp(r.packs*r.i.c)}</div>`:'—'}</td><td>${f(Math.max(0,r.left),r.i.u)}</td></tr>`).join('')}</table>
  <p>В корзине: <b>${inCart}</b> из <b>${need.length}</b> позиций<br>
  Упаковок к покупке: <b>${packs}</b><br>Стоимость закупки: <span class="tot">${gbp(cost)}</span></p>
  ${S.applied
   ?`<div class="sm">Применено: остатки обновлены (куплено и израсходовано).</div>
   <button class="pri" onclick="nextCycle()">Следующие 2 дня с этими остатками</button>
   <button class="dn" onclick="undo()" style="margin-top:8px">Отменить применение</button>`
   :`<button class="pri" onclick="apply()">Купил и приготовил → обновить остатки</button>`}
  </div>`;
  return h;
}

function setSt(id,v){v=+v;if(v>0)S.pantry[id]=v;else delete S.pantry[id];save();render()}
function delSt(id){delete S.pantry[id];save();render()}
function addSt(){
  const id=$('#sid').value,v=+$('#sq').value;
  if(!(v>0))return;
  S.pantry[id]=(S.pantry[id]||0)+v;save();render();
}
function clearSt(){if(confirm('Очистить все остатки?')){S.pantry={};save();render()}}
function vStock(){
  const m=ingMap(),ent=Object.entries(S.pantry).filter(([id])=>m[id]);
  return `<div class="card"><h3>Остатки продуктов</h3>
  ${ent.length?ent.map(([id,v])=>`<div class="row"><span>${esc(m[id].n)}</span><span>
  <input type="number" step="any" min="0" value="${v}" style="width:90px" onchange="setSt('${id}',this.value)"> ${U[m[id].u]}
  <button class="dn" onclick="delSt('${id}')">×</button></span></div>`).join(''):'<div class="sm">Пусто</div>'}
  ${ent.length?`<button onclick="clearSt()">Очистить всё</button>`:''}</div>
  <div class="card"><h3>Добавить вручную</h3>
  <select id="sid">${ING().map(i=>`<option value="${i.id}">${esc(i.n)} (${U[i.u]})</option>`).join('')}</select>
  <input id="sq" type="number" min="0" step="any" placeholder="Кол-во" style="width:100px">
  <button class="pri" onclick="addSt()">Добавить</button></div>`;
}

function toggleDish(id,on){S.off=S.off.filter(x=>x!==id);if(!on)S.off.push(id);save();render()}
function delDish(id){
  const d=DISH().find(x=>x.id===id);
  if(!d||!confirm('Удалить блюдо «'+d.n+'»?'))return;
  touch();
  if(id[0]==='c')S.cd=S.cd.filter(x=>x.id!==id);
  else{if(!S.del.includes(id))S.del.push(id);delete S.ed[id]}
  S.off=S.off.filter(x=>x!==id);
  if(editing===id)editing=null;
  fixMenu();
  save();render();
}
function restoreDishes(){
  if(!confirm('Вернуть все удалённые встроенные блюда?'))return;
  S.del=[];fixMenu();save();render();
}

// ---------- редактирование блюда ----------
function startEdit(id){
  if(!DISH().find(d=>d.id===id))return;
  editing=id;tab='dishes';render();
}
function cancelEdit(){editing=null;render()}
function resetDish(id){
  if(!confirm('Вернуть блюдо к исходному виду?'))return;
  touch();delete S.ed[id];editing=null;fixMenu();save();render();
}
// форма: пустая или заполненная редактируемым блюдом
function initForm(){
  if(!editing){addRow();return}
  const d=DISH().find(x=>x.id===editing);
  if(!d){editing=null;addRow();return}
  const m=ingMap();
  $('#dn').value=d.n;$('#dc').value=d.c;
  for(const id in d.i){
    const r=addRow(),inp=r.querySelector('.rn');
    inp.value=m[id].n;onName(inp);
    r.querySelector('.ra').value=d.i[id];
  }
  $('#form').scrollIntoView({behavior:'smooth',block:'start'});
}

// конструктор блюда: название с подсказками из библиотеки продуктов
function addRow(){
  const d=document.createElement('div');d.className='card ir';
  d.innerHTML=`<input class="rn" list="ingl" autocomplete="off" placeholder="Название продукта (подсказки из библиотеки)" style="width:100%;margin-bottom:6px" oninput="onName(this)">
  <div class="row" style="flex-wrap:wrap;justify-content:flex-start">
  <select class="ru"><option value="g">г</option><option value="ml">мл</option><option value="pcs">шт</option></select>
  <input class="ra" type="number" min="0" step="any" placeholder="на 1 порц." style="width:95px">
  <input class="rk" type="number" min="0" step="any" placeholder="ккал/100 (шт: на 1)" style="width:130px">
  <input class="rp" type="number" min="1" step="any" placeholder="упаковка" style="width:90px">
  <input class="rc" type="number" min="0" step="0.01" placeholder="цена упак. £" style="width:105px">
  <button onclick="this.closest('.ir').remove()">×</button></div>
  <div class="sm hint"></div>`;
  $('#dr').appendChild(d);
  return d;
}
// выбран продукт из библиотеки: подставить и заблокировать его параметры
function onName(inp){
  const ir=inp.closest('.ir');
  const ex=ING().find(x=>x.n.toLowerCase()===inp.value.trim().toLowerCase());
  const u=ir.querySelector('.ru'),k=ir.querySelector('.rk'),p=ir.querySelector('.rp'),c=ir.querySelector('.rc'),h=ir.querySelector('.hint');
  if(ex){
    u.value=ex.u;
    k.value=ex.u==='pcs'?Math.round(ex.k*10)/10:Math.round(ex.k*1000)/10;
    p.value=ex.p;c.value=ex.c;
    [u,k,p,c].forEach(e=>e.disabled=true);
    h.textContent='Продукт из библиотеки: единица, ккал, упаковка и цена берутся из неё. Введи только количество.';
  }else{
    [u,k,p,c].forEach(e=>{if(e.disabled){e.disabled=false;if(e!==u)e.value=''}});
    h.textContent='';
  }
}

function saveDish(){
  const n=$('#dn').value.trim(),c=$('#dc').value;
  const rows=[...document.querySelectorAll('#dr .ir')].map(r=>({
    name:r.querySelector('.rn').value.trim(),
    u:r.querySelector('.ru').value,
    a:+r.querySelector('.ra').value,
    k:+r.querySelector('.rk').value||0,
    p:+r.querySelector('.rp').value,
    c:+r.querySelector('.rc').value||0
  })).filter(r=>r.name||r.a);
  if(!n||!rows.length||rows.some(r=>!r.name||!(r.a>0))){
    alert('Нужны название блюда, а у каждого ингредиента — название и количество');return;
  }
  const i={};
  rows.forEach((r,idx)=>{
    let ex=ING().find(x=>x.n.toLowerCase()===r.name.toLowerCase());
    if(!ex){
      const p=r.p>0?r.p:(r.u==='pcs'?6:500);
      ex={id:'x'+Date.now()+'_'+idx,n:r.name,u:r.u,p,k:r.u==='pcs'?r.k:r.k/100,c:r.c};
      S.ci.push(ex);
    }
    i[ex.id]=(i[ex.id]||0)+r.a;
  });
  if(editing){
    touch();
    if(editing[0]==='c'){
      const k=S.cd.findIndex(x=>x.id===editing);
      if(k>=0)S.cd[k]={id:editing,c,n,i};
    }else S.ed[editing]={c,n,i};
    editing=null;
    fixMenu();
  }else S.cd.push({id:'c'+Date.now(),c,n,i});
  save();render();
}

function vDishes(){
  const m=ingMap();
  let h='';
  for(const c of 'bld'){
    const list=DISH().filter(d=>d.c===c);
    h+=`<div class="card"><h3>${NAMES[c]} (${list.length})</h3>`+list.map(d=>{
      const k=Math.round(Object.entries(d.i).reduce((a,[id,v])=>a+v*m[id].k,0));
      return `<div class="row"><label class="ck"><input type="checkbox" ${S.off.includes(d.id)?'':'checked'} onchange="toggleDish('${d.id}',this.checked)">
      <span>${esc(d.n)} <span class="sm">${k} ккал/порц.${S.ed[d.id]?' · изменено':''}</span></span></label>
      <span class="btns"><button onclick="startEdit('${d.id}')">✎</button><button class="dn" onclick="delDish('${d.id}')">×</button></span></div>`}).join('')+`</div>`;
  }
  h+=`<div class="card sm">Галочка — участвует в случайной выборке. ✎ — редактировать блюдо. × — удалить блюдо из списка. Блюда с удалённым продуктом скрыты.
  ${S.del.length?`<div><button onclick="restoreDishes()">Вернуть удалённые (${S.del.length})</button></div>`:''}</div>`;
  const canReset=editing&&editing[0]!=='c'&&S.ed[editing];
  h+=`<div class="card" id="form"><h3>${editing?'Редактировать блюдо':'Добавить блюдо'}</h3>
  <datalist id="ingl">${ING().map(i=>`<option value="${esc(i.n)}">${U[i.u]}, упак. ${i.p}</option>`).join('')}</datalist>
  <input id="dn" placeholder="Название" style="width:100%;margin-bottom:6px">
  <select id="dc"><option value="b">Завтрак</option><option value="l">Ланч</option><option value="d">Ужин</option></select>
  <div id="dr"></div>
  <button onclick="addRow()">+ ингредиент</button>
  ${editing
    ?`<button class="pri" onclick="saveDish()">Сохранить изменения</button>
      <button onclick="cancelEdit()" style="margin-top:8px">Отмена</button>
      ${canReset?`<button class="dn" onclick="resetDish('${editing}')" style="margin-top:8px">Вернуть исходное</button>`:''}`
    :`<button class="pri" onclick="saveDish()">Сохранить блюдо</button>`}
  <div class="sm">Начни вводить название ингредиента — появятся продукты из библиотеки. Если выбрать готовый, его параметры подставятся сами. Нового продукта нет в списке — введи название и параметры вручную, он добавится в библиотеку. Количество — на 1 порцию. Упаковка не указана — подставится 500 г/мл или 6 шт.</div></div>`;
  return h;
}

function setPack(id,v){v=+v;if(v>0)S.packs[id]=v;else delete S.packs[id];touch();save();render()}
function setPrice(id,v){
  v=parseFloat(String(v).replace(',','.'));
  if(isNaN(v)||v<0)delete S.prices[id];else S.prices[id]=v;
  save();render();
}
function resetPrices(){if(confirm('Вернуть все цены к стандартным?')){S.prices={};save();render()}}
function addIng(){
  const n=$('#in').value.trim(),u=$('#iu').value,p=+$('#ip').value,k=+$('#ik').value||0,c=+$('#ic').value||0;
  if(!n||!(p>0)){alert('Нужны название и размер упаковки');return}
  S.ci.push({id:'x'+Date.now(),n,u,p,k:u==='pcs'?k:k/100,c});save();render();
}
function delIng(id){
  const it=ingMap()[id];if(!it)return;
  const used=DISH().filter(d=>id in d.i);
  const msg='Удалить продукт «'+it.n+'»?'+(used.length?'\nБлюда с ним ('+used.length+') тоже пропадут из списка.':'');
  if(!confirm(msg))return;
  touch();
  if(id[0]==='x'){
    S.ci=S.ci.filter(i=>i.id!==id);
    S.cd=S.cd.filter(d=>!(id in d.i));
    delete S.packs[id];delete S.prices[id];
  }else if(!S.delI.includes(id))S.delI.push(id);
  delete S.pantry[id];
  fixMenu();save();render();
}
function restoreIngs(){
  if(!confirm('Вернуть все удалённые встроенные продукты?'))return;
  S.delI=[];save();render();
}
function vIngs(){
  const cost=buyCost(buyRows());
  return `<div class="card"><h3>Стоимость закупки</h3>
  <div class="tot">${gbp(cost)}</div>
  <div class="sm">По текущему меню, за вычетом остатков, упаковками целиком. Детали — во вкладке «Покупки».</div></div>
  <div class="card"><h3>Продукты, упаковки и цены</h3>
  <div class="sm">Цена — за одну упаковку, £. Цены Tesco UK приблизительные: сверь с tesco.com и поправь. Пустое поле — вернуть стандартную цену. Размер упаковки задаёт округление закупки вверх. × — удалить продукт.</div>
  <table><tr><th>Продукт</th><th>Упаковка</th><th>£</th><th></th></tr>
  ${ING().map(i=>`<tr><td>${esc(i.n)}<div class="sm">${i.u==='pcs'?Math.round(i.k)+' ккал/шт':Math.round(i.k*100)+' ккал/100'}</div></td>
  <td><input type="number" min="1" step="any" value="${i.p}" style="width:72px" onchange="setPack('${i.id}',this.value)"> ${U[i.u]}</td>
  <td><input type="number" min="0" step="0.01" value="${i.c}" style="width:64px" onchange="setPrice('${i.id}',this.value)"></td>
  <td><button class="dn" onclick="delIng('${i.id}')">×</button></td></tr>`).join('')}</table>
  <button onclick="resetPrices()" style="margin-top:8px">Сбросить все цены</button>
  ${S.delI.length?`<button onclick="restoreIngs()" style="margin-top:8px">Вернуть удалённые продукты (${S.delI.length})</button>`:''}</div>
  <div class="card"><h3>Добавить продукт</h3>
  <input id="in" placeholder="Название" style="width:100%;margin-bottom:6px">
  <select id="iu"><option value="g">граммы</option><option value="ml">мл</option><option value="pcs">штуки</option></select>
  <input id="ip" type="number" min="1" step="any" placeholder="Упаковка" style="width:100px">
  <input id="ik" type="number" min="0" step="any" placeholder="Ккал/100 или /шт" style="width:140px">
  <input id="ic" type="number" min="0" step="0.01" placeholder="Цена упак. £" style="width:110px">
  <button class="pri" onclick="addIng()">Добавить</button></div>`;
}

function render(){
  $('#tabs').innerHTML=TABS.map(([k,l])=>`<button class="${k===tab?'on':''}" onclick="setTab('${k}')">${l}</button>`).join('');
  $('#view').innerHTML={menu:vMenu,buy:vBuy,stock:vStock,dishes:vDishes,ings:vIngs}[tab]();
  if(tab==='dishes')initForm();
  const on=$('#tabs .on');if(on&&on.scrollIntoView)on.scrollIntoView({inline:'center',block:'nearest'});
}

// ---------- свайп между вкладками ----------
let tx=0,ty=0,sw=false;
document.addEventListener('touchstart',e=>{
  const t=e.touches[0];tx=t.clientX;ty=t.clientY;
  sw=e.touches.length===1&&!e.target.closest('input,select,textarea,#tabs');
},{passive:true});
document.addEventListener('touchend',e=>{
  if(!sw)return;sw=false;
  const t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;
  if(Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*1.5)return;
  const i=TABS.findIndex(x=>x[0]===tab),n=i+(dx<0?1:-1);
  if(n<0||n>=TABS.length)return;
  setTab(TABS[n][0]);window.scrollTo(0,0);
},{passive:true});

if(!S.menu||!S.menu.length)gen();else render();
</script>
</body>
</html>
